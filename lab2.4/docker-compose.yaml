name: lab2
services:
  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: webapp
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: [ "CMD-SHELL", "curl http://127.0.0.1:8000/random" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - intranet1

  client1:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - URL=http://webapp:8000/random
    volumes:
      - ./log:/tmp/log
    depends_on:
      webapp:
        condition: service_healthy
    deploy:
      replicas: 2
    networks:
      - intranet1

networks:
  intranet1:
    driver: bridge