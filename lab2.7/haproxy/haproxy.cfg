global
	maxconn 2048
	#log stdout local0 debug
	log stdout format raw local0
	stats timeout 30s
	stats socket 0.0.0.0:9999 level admin

defaults
	log	global
	mode	http
	option	httplog
	option	dontlognull
        option  forwardfor
	option  http-server-close
        timeout connect 5000
        timeout client  50000
        timeout server  10m

frontend healthcheck
    # Bind to a local port inside the container
    bind 127.0.0.1:8181
    mode http
    
    # Enable a basic built-in monitor endpoint
    monitor-uri /health

frontend api_resp
	bind 0.0.0.0:8000
	mode http
	log global
    	option httplog

	acl webapp_acl hdr(host) webapp
	acl webapp_acl path -i -m beg /random

	use_backend wbackend      if webapp_acl

frontend stats
	bind 0.0.0.0:8888
	log global
	option httplog
	stats enable
	stats uri /stats
	stats refresh 10

backend wbackend
        mode http
        option forwardfor
        option prefer-last-server
        cookie mycookies insert indirect nocache
        balance roundrobin
        http-request add-header X-Forwarded-Port %[dst_port]
        http-request add-header X-Forwarded-Proto https if { ssl_fc }
        http-request add-header X-Client-IP %[src]
